# 仅用于冒烟测试：由 github-actions[bot] 发一条 @agent 的评论，制造一条真实通知。
name: ping-agent
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to comment on
        required: true
        default: "3"
      request:
        description: Request text for the agent
        required: true
        default: "请在 README.md 末尾添加一行中文项目简介，然后提一个 Pull Request。改动尽量小。"
permissions:
  issues: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Comment as github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          REQUEST: ${{ inputs.request }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "@cjsmme-wq $REQUEST"
